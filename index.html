<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Productivity Dashboard</title>

  <!-- Theme-init: applied synchronously before first paint to prevent FOUC -->
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('ppd_theme');
        document.body.dataset.theme = theme === 'dark' ? 'dark' : 'light';
      } catch (e) {
        document.body.dataset.theme = 'light';
      }
    })();
  </script>

  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-theme="light">

  <!-- ═══════════════════════════════════════════════
       Greeting Widget
  ═══════════════════════════════════════════════ -->
  <header class="widget widget--greeting" aria-label="Greeting">
    <p id="greeting-time" class="greeting__time">--:--</p>
    <p id="greeting-date" class="greeting__date"></p>
    <p id="greeting-text" class="greeting__text"></p>
  </header>

  <!-- ═══════════════════════════════════════════════
       Theme Toggle
  ═══════════════════════════════════════════════ -->
  <div class="widget widget--theme" aria-label="Theme">
    <button id="theme-toggle" class="btn btn--secondary theme-toggle" aria-pressed="false" aria-label="Toggle dark mode">
      🌙 Dark Mode
    </button>
  </div>  

  <!-- ═══════════════════════════════════════════════
       Focus Timer Widget
  ═══════════════════════════════════════════════ -->
  <section class="widget widget--timer" aria-label="Focus Timer">
    <h2 class="widget__title">Focus Timer</h2>
    <p id="timer-display" class="timer__display">25:00</p>
    <div class="timer__controls" role="group" aria-label="Timer controls">
      <button id="timer-start" class="btn btn--primary" aria-label="Start timer">Start</button>
      <button id="timer-stop"  class="btn btn--secondary" aria-label="Stop timer">Stop</button>
      <button id="timer-reset" class="btn btn--secondary" aria-label="Reset timer">Reset</button>
    </div>
    <p id="timer-error" class="inline-error" role="alert" aria-live="polite"></p>
  </section>

  <!-- ═══════════════════════════════════════════════
       To-Do List Widget
  ═══════════════════════════════════════════════ -->
  <section class="widget widget--todo" aria-label="To-Do List">
    <h2 class="widget__title">To-Do</h2>
    <form id="todo-form" class="todo__form" novalidate>
      <label for="todo-input" class="sr-only">New task description</label>
      <input
        id="todo-input"
        type="text"
        class="input"
        placeholder="Add a task…"
        maxlength="500"
        autocomplete="off"
        aria-describedby="todo-error"
      />
      <button type="submit" class="btn btn--primary" aria-label="Add task">Add</button>
    </form>
    <p id="todo-error" class="inline-error" role="alert" aria-live="polite"></p>
    <ul id="todo-list" class="todo__list" aria-label="Tasks" aria-live="polite"></ul>
    <p id="todo-empty" class="empty-state">No tasks yet. Add one above!</p>
  </section>

  <!-- ═══════════════════════════════════════════════
       Quick Links Widget
  ═══════════════════════════════════════════════ -->
  <section class="widget widget--links" aria-label="Quick Links">
    <h2 class="widget__title">Quick Links</h2>
    <form id="links-form" class="links__form" novalidate>
      <label for="link-label-input" class="sr-only">Link label</label>
      <input
        id="link-label-input"
        type="text"
        class="input"
        placeholder="Label"
        maxlength="50"
        autocomplete="off"
        aria-describedby="links-error"
      />
      <label for="link-url-input" class="sr-only">Link URL</label>
      <input
        id="link-url-input"
        type="url"
        class="input"
        placeholder="https://example.com"
        maxlength="2048"
        autocomplete="off"
        aria-describedby="links-error"
      />
      <button type="submit" id="links-add-btn" class="btn btn--primary" aria-label="Add link">Add</button>
    </form>
    <p id="links-error"    class="inline-error"  role="alert" aria-live="polite"></p>
    <p id="links-capacity" class="capacity-msg"  aria-live="polite"></p>
    <div id="links-list" class="links__list" aria-label="Saved links" aria-live="polite"></div>
    <p id="links-empty" class="empty-state">No links yet. Add one above!</p>
  </section>

  <!-- ═══════════════════════════════════════════════
       Settings Panel
  ═══════════════════════════════════════════════ -->
  <section class="widget widget--settings" aria-label="Settings">
    <h2 class="widget__title">Settings</h2>

    <form id="settings-name-form" class="settings__form" novalidate>
      <label for="settings-name-input" class="settings__label">Display Name</label>
      <input
        id="settings-name-input"
        type="text"
        class="input"
        placeholder="Your name"
        maxlength="50"
        autocomplete="name"
        aria-describedby="settings-name-error"
      />
      <button type="submit" class="btn btn--primary" aria-label="Save display name">Save</button>
      <p id="settings-name-error" class="inline-error" role="alert" aria-live="polite"></p>
    </form>

    <form id="settings-duration-form" class="settings__form" novalidate>
      <label for="settings-duration-input" class="settings__label">Focus Duration (minutes)</label>
      <input
        id="settings-duration-input"
        type="number"
        class="input input--narrow"
        min="1"
        max="120"
        placeholder="25"
        aria-describedby="settings-duration-error"
      />
      <button type="submit" class="btn btn--primary" aria-label="Save focus duration">Save</button>
      <p id="settings-duration-error" class="inline-error" role="alert" aria-live="polite"></p>
    </form>
  </section>

  <!-- ═══════════════════════════════════════════════
       Placeholder Section (future features)
  ═══════════════════════════════════════════════ -->
  <section class="widget widget--placeholder" aria-label="Coming soon">
    <p class="placeholder__label">Coming Soon — Pictures &amp; Sounds</p>
  </section>

  <!-- Notification container (managed by NotificationService) -->
  <div id="notifications" class="notifications" aria-live="polite" aria-atomic="true"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
